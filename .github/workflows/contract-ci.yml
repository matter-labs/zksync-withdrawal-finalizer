name: Contracts CI

on:
  push:
    branches:
      - main

  pull_request:
  merge_group:

env: 
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
        # Dummy address needed for successful compilation of the contract
        CONTRACTS_L1_ASSET_ROUTER_ADDR: "0x0000000000000000000000000000000000000000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
    
      - name: Compile (Hardhat)
        run: npm run contracts:build

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: solhint (contracts only)
        run: npx solhint "contracts/**/*.sol"

      - name: prettier (contracts only)
        run: npx prettier --plugin=prettier-plugin-solidity --check "contracts/**/*.sol"

  #
  # Missing test job!
  #

  slither:
    needs: [build]
    runs-on: ubuntu-latest
    env:
        # Dummy address needed for successful compilation of the contract
        CONTRACTS_L1_ASSET_ROUTER_ADDR: "0x0000000000000000000000000000000000000000"    

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Slither
        run: pip install slither-analyzer

      # Preferred: force Slither to use Hardhat framework & artifacts
      - name: Run Slither (using Hardhat artifacts)
        run: |
          slither . --compile-force-framework hardhat \
            --filter-paths "node_modules|artifacts|cache"
